[project]
name = "switrs-agent"
version = "0.2.0"
description = "Grounded question answering over California SWITRS collision data: server-compiled metrics and evidence-bound answers"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "claude-agent-sdk>=0.2.168",
    "duckdb>=1.5.6",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "markdown-it-py>=4.2.0",
    "openai>=3.35.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.23.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
switrs = "switrs_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switrs_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.index:app"
